name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Two jobs rather than one matrix on purpose: the job name is the status-check name
  # branch protection points at, and a matrix would rename the existing required check
  # out from under it. Keeping `typecheck + test` stable means protection stays valid
  # whether or not this file has landed yet.
  check:
    name: typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      # All five checks are also guarded inside `bun test`; this step reruns them for a
      # per-check summary in the log.
      - name: docs lint
        run: bun scripts/docs-lint.ts

  # macOS is not redundant with Linux: pi-tui ships prebuilt native modifier helpers for
  # darwin and win32 only and degrades to a JS path elsewhere, so the TUI key handling
  # exercised on Linux is not the path a developer actually runs.
  check-macos:
    name: typecheck + test (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
