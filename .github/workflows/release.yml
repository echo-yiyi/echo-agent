name: Release

# 推 `v*` tag 即发布。发布逻辑全在 `scripts/release.ts`，本文件只负责环境与前置检查——
# 本地首发与这里走同一段代码。
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # trusted publishing（OIDC）：npm 凭它认出「这是 echo-yiyi/echo-agent 的 release.yml」，
  # 不需要任何 npm token，也就没有 token 可泄漏。每个包要先在 npm 上用 `npm trust github` 登记本文件名。
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    # trusted publishing 只认 GitHub 托管的 runner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: npm supports trusted publishing (>= 11.5.1)
        run: |
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            const ok = a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1)));
            if (!ok) { console.error(`npm ${process.argv[1]} < 11.5.1`); process.exit(1); }
          ' "$(npm --version)"

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

      - name: publish
        run: bun scripts/release.ts --publish --git-tag "$GITHUB_REF_NAME"
