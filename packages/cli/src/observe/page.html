<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Echo · observe</title>
<style>
/* token 来自设计系统 dist/coding/tokens.css（vendor/echo-tokens，带账本）；本文件不写任何裸色值 / 裸间距 */
/*__TOKENS__*/

*, *::before, *::after { box-sizing: border-box; }
html { color-scheme: light dark; }
body {
  margin: 0;
  font-family: var(--font-sans);
  font-size: var(--size-content);
  line-height: var(--line-content);
  color: var(--ink);
  background: var(--paper);
}
code, .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: var(--focus-ring-width) solid var(--accent); outline-offset: var(--focus-ring-offset); }

.page { padding: var(--space-16) var(--space-20); max-width: 1440px; margin: 0 auto; }

/* 页头（console.md §2）：每页一次，h2 + 说明 + 右侧动作区 */
.pagehead { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-16); margin-bottom: var(--space-16); }
.pagehead h2 { margin: 0; font-size: var(--size-h2); font-weight: 600; white-space: nowrap; }
.pagehead .desc { margin: var(--space-4) 0 0; font-size: var(--size-ui); color: var(--stone); max-width: 68ch; }
.pagehead .actions { display: flex; align-items: center; gap: var(--space-8); flex-shrink: 0; }

.btn {
  height: var(--ctl-btn-height); padding: 0 var(--ctl-btn-pad-x); border-radius: var(--r-sm);
  border: 1px solid var(--border); background: var(--surface); font-size: var(--size-ui); cursor: pointer;
  transition: background var(--duration) var(--ease);
}
.btn:hover { background: var(--ui-raised); }
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-wash); }
.btn:active { transform: scale(var(--press-scale)); }

/* 列表-详情骨架（console.md §1）：列表栏固定宽、详情栏吃剩余；顶边对齐 */
.split { display: grid; grid-template-columns: var(--ctl-list-pane-width) 1fr; gap: var(--ctl-split-gap); align-items: start; }
@media (max-width: 720px) { .split { grid-template-columns: 1fr; } }
.pane { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); }

/* 筛选栏（§7）：恒两行——上行会话下拉、下行来源片；筛选片用 aria-pressed；无数据只降透明度不移除；计数是筛后数 */
.filters { display: flex; flex-direction: column; gap: var(--space-6); padding: var(--space-8) var(--ctl-list-item-pad-x); border-bottom: 1px solid var(--border); }
.filters .selrow { display: flex; align-items: center; gap: var(--space-6); }
/* 来源片一行放得下就别换行：列表栏只有 280px，片子被 flex 压扁会变成「全...」「用...」，等于没有标签 */
.filters .chiprow { display: flex; align-items: center; gap: var(--space-4); }
.filters .chiprow .chip { flex: 0 0 auto; max-width: none; padding: 0 var(--space-6); }
.select {
  flex: 1 1 auto; min-width: 0; height: 24px; padding: 0 var(--space-6); border: 1px solid var(--border); border-radius: var(--r-sm);
  background: var(--surface); color: var(--ink); font-size: var(--size-ui); cursor: pointer;
}
.select:hover { background: var(--ui-raised); }
.chip {
  height: 22px; padding: 0 var(--space-8); border-radius: var(--r-full); border: 1px solid var(--border); background: transparent;
  font-size: var(--size-caption); color: var(--ink-70); cursor: pointer;
  /* 会话名就是那段对话的第一句话，可以很长：片子恒单行、超出打点，全名在 title 里（§7 筛选片不换行） */
  max-width: 148px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-wash); }
.chip--dimmed { opacity: 0.45; }
.filters .count { flex: 0 0 auto; font-size: var(--size-caption); color: var(--stone); font-variant-numeric: tabular-nums; }

/* 列表栏整体不超过一屏：筛选栏与「运行时活动」定高，中间的 run 列表吃剩下的高度并自己滚。
   原来只给 .runs 定 max-height，底部的活动区就被视口切掉了（实测看不到最后几条）。 */
.split > aside { display: flex; flex-direction: column; max-height: calc(100vh - 96px); /* 96px = 页头 + 页边距 */ }
.split > aside > .filters { flex: 0 0 auto; }
/* 实体行（§5.2）：selected = 左侧 2px 声色条 + accent-wash；hover 只换底 */
.runs { list-style: none; margin: 0; padding: 0; flex: 1 1 auto; min-height: 120px; overflow: auto; }
.run {
  display: block; width: 100%; text-align: left; background: transparent; border: 0; border-bottom: 1px solid var(--ui-line-soft);
  padding: var(--ctl-list-item-pad-y) var(--ctl-list-item-pad-x); cursor: pointer;
  box-shadow: inset 2px 0 0 transparent; transition: background var(--duration) var(--ease);
}
.run:hover { background: var(--ui-raised); }
.run[aria-selected="true"] { background: var(--accent-wash); box-shadow: inset 2px 0 0 var(--accent); }
.run .l1 { display: flex; align-items: baseline; gap: var(--space-6); }
.run .l1 .dur { margin-left: auto; flex-shrink: 0; font-size: var(--size-caption); color: var(--stone); }
.run .l2 { margin-top: var(--space-2); display: flex; align-items: center; gap: var(--space-8); font-size: var(--size-caption); color: var(--stone); }
/* 实体标识（console.md §5.1）：用户扫读时找的是「这是哪段对话」，不是 runId——runId 在 title 与详情里可得 */
.run .name { flex: 1; min-width: 0; font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.run .l2 .ws { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
/*
 * 整理（dream）run：记忆整理，每轮用户对话之后自动排一条、几毫秒就完，实测 16 条里占 8 条。
 * 它是系统自理，不是用户干的活。**不隐藏**（§7：筛选面与数据都不藏）、**也不换一副骨架**——
 * 排版节奏统一为两行，只把整行调暗，让它退到背景里。
 */
.run--minor .name { font-weight: 400; color: var(--ink-70); }
.run--minor .l1 .dur, .run--minor .l2 { opacity: 0.75; }
.filters .sep { width: 1px; height: 14px; background: var(--border); margin: 0 var(--space-2); }

/*
 * 状态的三种重量（2026-09-07 用户定的视觉分工）。此前每一处状态都用色块，一页几十个小方块，
 * 结果是「每条记录都显得很重要」，真正可点的筛选片反而不好认。现在按「要不要立刻注意」分：
 *   · 需要立刻注意（失败 / 有缺口 / 降级）→ 色块 `.badge`（DESIGN §6.2 三件套：主色文字 + 极浅底 + 同色浅描边）
 *   · 正常终态（已完成 / 完整 / 已落盘）→ `.dot` 小圆点 + 文字，无边框无底
 *   · 次要属性（来源、产品）→ 普通文本
 * 中英双写也收了：默认只出中文，英文技术标识进 title（`已完成 completed` 这类双写把每个标签撑成两倍宽）。
 */
.badge { display: inline-flex; align-items: center; gap: var(--space-4); height: 18px; padding: 0 var(--space-6); border-radius: var(--r-sm); font-size: var(--size-caption); border: 1px solid var(--border); color: var(--ink-70); background: var(--ui-inset); white-space: nowrap; }
.dot { display: inline-flex; align-items: center; gap: var(--space-4); font-size: var(--size-caption); color: var(--stone); white-space: nowrap; }
.dot::before { content: ""; width: 5px; height: 5px; border-radius: var(--r-full); background: currentColor; flex-shrink: 0; } /* 圆点直径取 components.md §5.2 标准密度 */
/*
 * 颜色规则（2026-09-07 用户定，全页只有这一条）：
 *   · **紫（accent）只表示「你能操作 / 你选中了」**——选中的 run、按下的筛选片、焦点环。数据里一律不用它。
 *   · **正常状态用中性点**：已完成 / 完整 / 已落盘走 stone。它们该看得见，但不该是每行最醒目的东西——
 *     16 行全是「已完成」时，那点绿不携带任何信息，只是把每条记录都渲染成很重要。
 *   · **只有失败（clay）与警告（marigold）拿强色**，且升级成色块而不是圆点。
 *   · 来源、产品这类属性靠文字区分，不给颜色。
 * 所以这里没有 `.dot--positive` / `.dot--info`：正常与信息性状态共用 `.dot` 的 stone。
 */
/* 「没有数据」有自己的样子（components.md §5.3）：中性色 + 虚线，绝不借用成功的绿 */
.dot--none::before { background: transparent; border: 1px dashed var(--ui-ink-4); }
/* 色块只有这两种：其余色调走 `.dot`，见上面的颜色规则 */
.badge--caution { color: var(--marigold); background: var(--marigold-soft); border-color: var(--marigold-line); }
.badge--critical { color: var(--clay); background: var(--clay-soft); border-color: var(--clay-line); }

/* 空态（components §9）：说明这里会出现什么 + 明确的下一步 */
.empty { padding: var(--space-32) var(--space-16); text-align: center; color: var(--stone); font-size: var(--size-ui); }
.empty code { display: inline-block; margin-top: var(--space-8); color: var(--ink-70); }

/* 详情 */
.detail { padding: var(--card-padding); min-height: 320px; }
.detail .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-8); margin-bottom: var(--space-4); }
.detail .head .dur { font-size: var(--size-ui); }
/* 状态一组靠右：三枚圆点聚在一处，不夹在标题与时长中间把标题切碎 */
.detail .head .marks { margin-left: auto; display: flex; align-items: center; gap: var(--space-8); }
/* 实体名在最大号（console.md §5.1）：用户认的是「这是哪段对话」。runId 是系统标识符，退到副标题里 */
.detail .head .title { font-size: var(--size-h3); font-weight: 600; color: var(--ink); }
.detail .head .id { font-size: var(--size-h3); font-weight: 600; }
.detail .sub { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-6); margin: 0 0 var(--space-12); font-size: var(--size-caption); color: var(--stone); }
.detail .sub .runid { font-family: var(--font-mono); }
/* 运行环境：每条 run 几乎一样的那几行（agent 实例 id、会话 id、装配槽），默认收起，要查时一键展开 */
.env { margin-bottom: var(--space-12); }
.env > summary { cursor: pointer; font-size: var(--size-caption); color: var(--stone); list-style: none; }
.env > summary::-webkit-details-marker { display: none; }
.env > summary::before { content: "▸ "; }
.env[open] > summary::before { content: "▾ "; }
.env > summary:hover { color: var(--ink-70); }
.env .fields { margin-top: var(--space-8); }
/*
 * 详情栏分三个区块：运行摘要（标题 / 副标题 / 运行环境）→ 执行过程 → 工具与用量。
 * 分节靠「一段留白 + 一条淡分隔线 + 小标题」，**不给每块再套卡片**——卡里套卡只会让边框更多（用户评审第 6 条）。
 * 首块不需要线：标题本身就是它的开头。`text-transform: uppercase` 去掉了，中文上它什么都不做，
 * 只会让夹着的英文字母突然喊起来。
 */
.detail h3 { margin: var(--space-24) 0 var(--space-12); padding-top: var(--space-16); border-top: 1px solid var(--ui-line-soft); font-size: var(--size-ui); font-weight: 600; color: var(--ink); }

/* 字段行（§4）：标签列固定宽，值列自适应；内容槽只有纯文本 / chip 组 / key-value 三种 */
.fields { display: grid; grid-template-columns: var(--ctl-field-label-width) 1fr; row-gap: var(--ctl-field-row-gap); column-gap: var(--space-12); }
.fields dt { margin: 0; color: var(--stone); font-size: var(--size-ui); }
.fields dd { margin: 0; font-size: var(--size-ui); }
.chips { display: flex; flex-wrap: wrap; gap: var(--space-4); }
.chips .chip { cursor: default; }

/*
 * 时间线：**固定四列 + 一条条形轨**（2026-09-07 用户定）——时间 | 事件 | 用量 | 耗时 | 条。
 * 此前是「时间 | 1fr | 结果靠最右」，容器一宽，耗时与 token 被推到几百像素之外，一行信息要横跨整屏才读得全。
 * 事件列限阅读宽度（46ch），剩下的宽度交给条形轨——留白因此参与表达，而不是纯粹的空。
 */
.timeline { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--border); }
/*
 * 列宽定义一次，时间刻度用同一份，两者才对得齐。
 * **事件列封顶、条形轨吃剩余**：两者都封顶（上一版把轨道也限成 132px）会让 1800px 宽屏上
 * `轮 #1 56s` 与 `模型生成 52s` 两根条几乎重合、看不出先后（实测）；反过来只让事件列吃弹性
 * 又会在 1280px 下把刻度挤成重叠。`minmax(0, 46ch)` + `minmax(96px, 1fr)` 两头都成立：
 * 窄屏事件列缩、轨道保底 96px；宽屏事件列停在阅读宽度、剩下的全给轨道。
 */
.exec { --tl-cols: 18px 52px minmax(0, 54ch) max-content 52px minmax(96px, 1fr); }
.tl {
  position: relative;
  display: grid; grid-template-columns: var(--tl-cols);
  align-items: baseline; gap: var(--space-8);
  min-height: var(--ctl-tool-row-height); padding: var(--space-2) var(--space-8);
  font-size: var(--size-ui); color: var(--ink-70); cursor: pointer; border-radius: var(--r-sm);
}
/* 悬浮与选中必须一眼分得开：悬浮只换底，选中是浅紫底 + 左侧细线（紫 = 交互，见颜色规则） */
.tl:hover { background: var(--ui-raised); }
.tl[aria-selected="true"] { background: var(--accent-wash); box-shadow: inset 2px 0 0 var(--accent); }
/* 折叠箭头：图标小，命中区整格；没有子事件的行不画箭头，但格子留着，行首才对得齐 */
.caret { width: 18px; height: 18px; padding: 0; border: 0; background: transparent; color: var(--stone); cursor: pointer; border-radius: var(--r-sm); align-self: center; }
.caret:hover { background: var(--ui-raised); color: var(--ink); }
.caret[data-empty="1"] { visibility: hidden; cursor: default; }
.tl .folded { color: var(--stone); font-size: var(--size-micro); }
/* 条形轨占最后一列：左端 = 这条 span 在 run 里的起点，长度 = 它占 run 的比例 */
/*
 * 条形轨是数据不是交互，所以用中性墨色——紫留给「可操作 / 已选中」。失败那行的条才染色。
 * **阶段不靠色相区分**：设计系统的分类色板（dataviz.md §2）只在 spec 里，没进我 vendor 的 dist/tokens.css，
 * 而手抄 hex 是它明令禁止的（本页那道颜色门也会判红）。所以用「粗细 + 浓淡」分层：
 * 轮（容器）粗而实，模型 / 工具（叶子）细而淡。要真正的色相编码，得先把那张色板 build 进 dist。
 */
.tl .track { position: relative; align-self: center; height: 6px; }
.tl-bar { position: absolute; top: 1px; height: 4px; border-radius: var(--r-full); background: var(--ink-70); opacity: 0.24; }
.tl--turn .tl-bar { top: 0; height: 6px; opacity: 0.42; }
.tl--bad .tl-bar { background: var(--clay); opacity: 0.5; }
/* 起止点：条太短时（10ms / 12s）也要看得出它落在哪儿 */
.tl-bar::before { content: ""; position: absolute; left: 0; top: -1px; bottom: -1px; width: 1px; background: currentColor; opacity: 0.5; }
/* 字体分工：数字与技术标识走等宽，人读的词走界面字体——整行 mono 会让页面变成终端输出 */
.tl .t { font-family: var(--font-mono); color: var(--stone); text-align: right; font-variant-numeric: tabular-nums; font-size: var(--size-caption); }
.tl .what { display: flex; align-items: baseline; gap: var(--space-6); min-width: 0; }
.tl .what .prefix { width: var(--ctl-tool-prefix-width); flex-shrink: 0; color: var(--stone); }
.tl .what .verb { flex-shrink: 0; color: var(--ink-70); }
/*
 * 一行里谁先让：**参数预览先让，工具名与记录名不让**。
 * 上一版让 flex-shrink 按基准长度分配，结果是长参数把 `bash` 截成 `ba…`、把 `tool.execute` 截成 `t`
 * （实测截图）——工具叫什么是这行的身份，参数只是预览，截错了顺序整行就读不懂了。
 */
.tl .what .obj { font-family: var(--font-mono); flex: 0 0 auto; white-space: nowrap; }
.tl .what .arg { font-family: var(--font-mono); color: var(--stone); flex: 0 1 auto; min-width: 0; max-width: 22ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* 底层事件名再降一级，但保留可读对比度：它是查证用的锚，不是扫读目标。短且定长，不参与收缩 */
.tl .what .en { font-family: var(--font-mono); color: var(--stone); font-size: var(--size-micro); opacity: 0.85; flex: 0 0 auto; white-space: nowrap; }
.tl .usage, .tl .res { font-family: var(--font-mono); font-size: var(--size-caption); color: var(--stone); white-space: nowrap; text-align: right; font-variant-numeric: tabular-nums; }
.tl--boundary { color: var(--ink); }
/* 「轮 #1」要明显重过它旁边的 turn.execute：加重只加在动词上，不整行加粗 */
.tl--turn .verb { color: var(--ink); font-weight: 600; font-size: var(--size-content); }
.tl--turn .obj { color: var(--ink); font-weight: 600; }
.tl--bad { color: var(--clay); }
.tl--bad .res, .tl--bad .verb { color: var(--clay); }
.tl--warn { color: var(--marigold); }
.tl--warn .res, .tl--warn .verb { color: var(--marigold); }
/* 「未收尾」比别的时长重一点，但不用紫——紫是交互色，见上面的颜色规则 */
.tl--open .res { color: var(--ink-70); }
.tl-detail { margin: 0 0 var(--space-4) var(--space-8); padding: var(--ctl-tool-expand-pad); max-height: var(--ctl-tool-expand-max-height); overflow: auto; border-left: 2px solid var(--border); background: var(--ui-inset); font-family: var(--font-mono); font-size: var(--size-caption); color: var(--ink-70); }
.tl-detail[hidden] { display: none; }
/* 运行时活动（run 之外的记录）：列表底部一小段，行形同时间线（时间 · 动作 对象 · 哪段会话），带 runId 的能点过去 */
.activity { flex: 0 0 auto; display: flex; flex-direction: column; max-height: 40%; border-top: 1px solid var(--border); padding: var(--space-8); }
.activity > summary { flex: 0 0 auto; cursor: pointer; font-size: var(--size-caption); font-weight: 600; color: var(--stone); list-style: none; }
.activity > summary::-webkit-details-marker { display: none; }
.activity > summary::before { content: "▸ "; font-weight: 400; }
.activity[open] > summary::before { content: "▾ "; }
.activity > summary:hover { color: var(--ink-70); }
.acts { list-style: none; margin: var(--space-4) 0 0; padding: 0; flex: 1 1 auto; min-height: 0; overflow: auto; }
.act { display: grid; grid-template-columns: 56px 1fr auto; gap: var(--space-6); align-items: baseline; padding: var(--space-2) 0; font-family: var(--font-mono); font-size: var(--size-caption); color: var(--ink-70); border-radius: var(--r-sm); }
.act[role="button"] { cursor: pointer; }
.act[role="button"]:hover { background: var(--ui-raised); }
.act .t { color: var(--stone); font-variant-numeric: tabular-nums; }
.act .what { display: flex; gap: var(--space-4); min-width: 0; }
.act .verb { white-space: nowrap; }
.act .obj { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.act .who { color: var(--stone); white-space: nowrap; }
/* content 档的正文分段：标签 + 原样文本；报错段用 clay。metadata 档没有这些字段，段落自然不出现 */
.tl-sec { margin-bottom: var(--space-8); }
.tl-sec-label { display: block; margin-bottom: var(--space-2); color: var(--stone); font-size: var(--size-micro); }
.tl-sec--bad .tl-text { color: var(--clay); }
.tl-text { margin: 0; font: inherit; white-space: pre-wrap; word-break: break-all; }

/* 表格也限阅读宽度：容器一宽，六列数字会被拉到屏幕两端，读一行要横扫整屏（与时间线同一条毛病） */
table { border-collapse: collapse; width: 100%; max-width: 76ch; font-size: var(--size-ui); }
th, td { text-align: left; padding: var(--ctl-table-cell-pad-y) var(--ctl-table-cell-pad-x); border-bottom: 1px solid var(--ui-line-soft); }
th { color: var(--stone); font-weight: 500; }
td.num, th.num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.usageline { max-width: 76ch; margin-top: var(--space-10); display: flex; flex-wrap: wrap; gap: var(--space-12); font-size: var(--size-ui); color: var(--ink-70); }
.usageline > span:first-child { color: var(--stone); }

/*
 * ── 排查用的三段版面（2026-09-07 用户评审第 3 条）──
 * 打开这页的人有三个问题：这次怎么样？为什么这么久？某一步发生了什么？
 * 对应三段：**顶部固定的运行概览** → **中间完整的时间线** → **右侧按需的事件详情**。
 * 关键是最后一段：原来点一行会就地展开一大块 JSON，把后面的行整个推下去，
 * 连着看两条就找不回位置了。现在选中只换右栏，时间线的位置不动。
 */
.overview { position: sticky; top: 0; z-index: 1; background: var(--surface); padding-bottom: var(--space-8); }
.overview .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--space-8); margin-bottom: var(--space-4); }
/* 指标行：把「这次怎么样」压成一排可扫的数——状态与总时长在标题行，明细在这里 */
.metrics { display: flex; flex-wrap: wrap; gap: var(--space-16); margin: var(--space-8) 0; font-size: var(--size-ui); }
.metric { display: flex; align-items: baseline; gap: var(--space-6); }
.metric .k { color: var(--stone); font-size: var(--size-caption); }
.metric .v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ink); }
.metric .v.bad { color: var(--clay); }
/* 采集提示是低强度信息条，不是正文段落 */
.infobar { display: flex; gap: var(--space-6); padding: var(--space-6) var(--space-8); border-left: 2px solid var(--ui-line-strong); background: var(--ui-inset); font-size: var(--size-caption); color: var(--ink-70); }
.problembar { margin-bottom: var(--space-12); border-left-color: var(--marigold); }
/* 状态解释：圆点可点，展开一行人话，而不是只在 title 里藏着 */
.marks .mark { border: 0; background: transparent; padding: 0; cursor: help; }
.markwhy { margin: var(--space-6) 0 0; font-size: var(--size-caption); color: var(--ink-70); }

/* 中段：时间线 + 事件详情。窄屏改成上下两块（抽屉留到真需要时再做，不假装有） */
.exec { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 380px); gap: var(--space-16); align-items: start; }
@media (max-width: 1180px) { .exec { grid-template-columns: 1fr; } }
/* 时间刻度：条形轨那一列的坐标系。没有它，几根灰线看着像滚动条 */
.scale { display: grid; grid-template-columns: var(--tl-cols); gap: var(--space-8); padding: 0 var(--space-8) var(--space-4); font-size: var(--size-micro); color: var(--stone); }
.scale .scalelabel { grid-column: 3; text-align: right; }
.scale .ticks { grid-column: 6; position: relative; height: 12px; border-bottom: 1px solid var(--ui-line-soft); }
.scale .tick { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--ui-line-soft); padding-left: 2px; white-space: nowrap; }
.scale .tick--end { border-left: 0; border-right: 1px solid var(--ui-line-soft); padding: 0 2px 0 0; transform: translateX(-100%); }

/* 事件详情：选中一条事件后的右栏。先给人话摘要，再给原始 JSON（默认收起） */
.evt { position: sticky; top: var(--space-40); border: 1px solid var(--border); border-radius: var(--r-md); background: var(--ui-inset); padding: var(--space-12); }
.evt .evthead { display: flex; align-items: baseline; gap: var(--space-6); margin-bottom: var(--space-8); }
.evt .evthead .verb { font-size: var(--size-content); font-weight: 600; color: var(--ink); }
.evt .evthead .obj { font-family: var(--font-mono); color: var(--ink-70); overflow: hidden; text-overflow: ellipsis; }
.evt .nav { margin-left: auto; display: flex; gap: var(--space-4); }
.evt .navbtn { height: 20px; min-width: 22px; padding: 0 var(--space-4); border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface); color: var(--ink-70); font-size: var(--size-caption); cursor: pointer; }
.evt .navbtn:disabled { opacity: 0.4; cursor: default; }
.evt .navbtn:hover:not(:disabled) { background: var(--ui-raised); }
.evt .fields { grid-template-columns: 5.5em 1fr; row-gap: var(--space-4); }
.evt .fields dt, .evt .fields dd { font-size: var(--size-caption); }
/* 「最耗时的几步」：右栏没选中时的入口，行形与时间线一致（动词 对象 …… 耗时） */
.slow { list-style: none; margin: 0; padding: 0; }
.slowrow { display: flex; align-items: baseline; gap: var(--space-6); width: 100%; padding: var(--space-4) var(--space-6); border: 0; border-radius: var(--r-sm); background: transparent; text-align: left; cursor: pointer; font-size: var(--size-ui); color: var(--ink-70); }
.slowrow:hover { background: var(--ui-raised); }
.slowrow .verb { flex-shrink: 0; color: var(--ink); }
.slowrow .obj { font-family: var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slowrow .res { margin-left: auto; flex-shrink: 0; font-family: var(--font-mono); color: var(--stone); font-variant-numeric: tabular-nums; }
.evt .raw { margin-top: var(--space-10); }
.evt .raw > summary { cursor: pointer; font-size: var(--size-caption); color: var(--stone); list-style: none; }
.evt .raw > summary::-webkit-details-marker { display: none; }
.evt .raw > summary::before { content: "▸ "; }
.evt .raw[open] > summary::before { content: "▾ "; }
.evt .rawbox { margin-top: var(--space-6); max-height: var(--ctl-tool-expand-max-height); overflow: auto; background: var(--surface); border: 1px solid var(--ui-line-soft); border-radius: var(--r-sm); padding: var(--space-8); }
.evt .rawbox pre { margin: 0; font-family: var(--font-mono); font-size: var(--size-caption); color: var(--ink-70); white-space: pre-wrap; word-break: break-all; }
/* 复制按钮：点完给回执，不然用户不知道有没有成 */
.copy { border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface); color: var(--stone); font-size: var(--size-micro); padding: 0 var(--space-4); height: 16px; cursor: pointer; }
.copy:hover { background: var(--ui-raised); color: var(--ink-70); }
.copy[data-done="1"] { color: var(--ink-70); border-color: var(--ui-line-strong); }
/* 记录健康是页脚：比区块更淡一档，不与「工具与用量」争成一个新区块 */
.health { margin-top: var(--space-24); padding-top: var(--space-12); border-top: 1px solid var(--ui-line-soft); font-size: var(--size-caption); color: var(--stone); display: flex; flex-wrap: wrap; gap: var(--space-12); align-items: center; }
.muted { color: var(--stone); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div class="page">
  <header class="pagehead">
    <div>
      <h2>Echo · observe</h2>
      <p class="desc" id="desc">正在连接…</p>
    </div>
    <div class="actions">
      <span class="muted" id="freshness" aria-live="polite"></span>
      <button class="btn" id="follow" aria-pressed="true" title="新 run 出现时自动切过去；关掉后停在你选的那条">跟随最新</button>
    </div>
  </header>

  <!-- 只在会话清单读不出来时出现：说清「run 照看，只是没名字」，不让人以为面板坏了 -->
  <div class="infobar problembar" id="problem" hidden></div>
  <div class="split">
    <aside class="pane" aria-label="run 列表">
      <div class="filters" id="filters" role="group" aria-label="按来源筛选"></div>
      <ul class="runs" id="runs"></ul>
      <!-- 后台活动折起（2026-09-07 用户定）：它是 run 之外的事，默认不该和 run 列表抢同一段视线 -->
      <details class="activity">
        <summary>运行时活动 <span class="muted" id="activity-hint" title="run 之外发生的事：收件、整批 ack、闹钟投递与错过、重启恢复"></span></summary>
        <ul class="acts" id="acts"></ul>
      </details>
    </aside>
    <main class="pane detail" id="detail" aria-live="polite"></main>
  </div>
</div>

<script>
const LEX = /*__LEXICON__*/ null;
const STATE = {
  runs: [], sessions: {}, filter: "all", product: "all", session: "all", selected: null, follow: true, vm: null,
  hidden: false, activity: [], root: "", envOpen: false,
  // 事件详情（2026-09-07 改版）：选中哪条事件、哪些行收起了、原始 JSON 展开没有、状态解释显示哪一条。
  // 都存在 STATE 里，因为详情每 2s 重绘一次——不存的话轮询会把用户刚打开的东西合上。
  selectedEvent: null, collapsed: new Set(), rawOpen: false, markWhy: "",
};
/* run 归哪个产品：header 只有 sessionId，产品名与 workspace 在会话 meta 里（/api/runs 顺带给） */
const sessionOf = (r) => (r.sessionId ? STATE.sessions[r.sessionId] : undefined);
const productOf = (r) => sessionOf(r)?.agent ?? (r.sessionId ? "未上报" : "无会话");
/* 会话怎么称呼：有名字用名字（那是它的第一句话，可以很长），没有就缩短的 id。列表行、活动行、筛选片都用它 */
const sessionLabel = (id) => { const s = STATE.sessions[id]; return s && s.name && s.name !== id ? s.name : shortId(id); };
/* 筛选片是一行的固定宽度控件：标签在这里就截断，全名进 title（CSS 的 ellipsis 兜底，这里保证 DOM 也不长） */
const clipLabel = (s, n = 14) => (s.length > n ? `${s.slice(0, n)}…` : s);
/** 这一组 run 在某个维度上是不是有多个值——只有多个值时才值得在每行重复它（同一个值写 16 遍不区分任何东西）。 */
const varies = (runs, of) => new Set(runs.map(of).filter((v) => v !== undefined && v !== "")).size > 1;
const shortPath = (p) => {
  if (!p) return "";
  const parts = p.split("/").filter(Boolean);
  return parts.length > 3 ? `…/${parts.slice(-3).join("/")}` : p;
};

const el = (tag, attrs, ...children) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs ?? {})) {
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (typeof v === "boolean" && !k.startsWith("aria-")) { if (v) n.setAttribute(k, ""); } // hidden 之类的布尔属性：有即真
    else if (v !== undefined && v !== null) n.setAttribute(k, String(v));
  }
  for (const c of children) if (c !== null && c !== undefined) n.append(c);
  return n;
};
const fmtMs = (ms) => (Math.abs(ms) < 1000 ? `${Math.round(ms)}ms` : `${(ms / 1000).toFixed(2)}s`);
const fmtClock = (t) => new Date(t).toLocaleTimeString("zh-CN", { hour12: false });
const shortId = (id) => (id.length > 22 ? `${id.slice(0, 12)}…${id.slice(-6)}` : id);

/* run 的终态：error + max_iterations 是「已截停」（设计系统 §2.1 硬性区分 completed 与 truncated） */
function statusKey(header, outcome) {
  if (header.status === "error" && outcome && outcome.error && outcome.error.code === "max_iterations") return "truncated";
  return header.status;
}
const termOf = (term, key) => term ?? { zh: key, en: key, tone: "neutral", hint: "" };
/** 英文标识与解释都进 title：默认只出中文，鼠标停下来才给技术名。 */
const termTitle = (t) => `${t.en}${t.hint ? ` — ${t.hint}` : ""}`;
/** 色块：只给「要立刻注意」的状态。 */
function badge(term, key) {
  const t = termOf(term, key);
  return el("span", { class: `badge badge--${t.tone}`, title: termTitle(t) }, t.zh);
}
/** 圆点 + 文字：正常状态用它，不与内容争注意力。 */
function dot(term, key, tone) {
  const t = termOf(term, key);
  return el("span", { class: `dot dot--${tone ?? t.tone}`, title: termTitle(t) }, t.zh);
}
/** 按「要不要立刻注意」自动选重量：critical / caution 走色块，其余走圆点。 */
function statusMark(term, key) {
  const t = termOf(term, key);
  return t.tone === "critical" || t.tone === "caution" ? badge(t, key) : dot(t, key);
}
/** 概览里的状态标记：点一下把解释显示在下面一行，而不是只藏在 title 里（评审：「完整」「已落盘」要可查看的解释）。 */
function markButton(term, key) {
  const t = termOf(term, key);
  const why = `${t.zh}（${t.en}）：${t.hint}`;
  const b = el("button", { class: "mark", "aria-label": `${t.zh}：点开解释` }, statusMark(t, key));
  b.addEventListener("click", () => { STATE.markWhy = STATE.markWhy === why ? "" : why; renderDetail(); });
  return b;
}
/** 跳到另一条 run（收件消费带着来源 run 时用）。 */
function openRun(runId) {
  STATE.selected = runId;
  STATE.selectedEvent = null;
  STATE.follow = false;
  renderFollow();
  history.replaceState(null, "", `?run=${encodeURIComponent(runId)}`);
  renderRuns();
  loadRun();
}

/* ── 列表 ── */
function renderFilters() {
  const box = document.getElementById("filters");
  box.replaceChildren();
  // 第零组：会话。agent 集群里几段并行时才出现（观测库一段一份，面板把会话根下全部段合起来看）
  const sessionCounts = {};
  for (const r of STATE.runs) if (r.sessionId) sessionCounts[r.sessionId] = (sessionCounts[r.sessionId] ?? 0) + 1;
  const sessionIds = Object.keys(sessionCounts);
  // 第一行：会话选择。会话名就是那段对话的第一句话，长且条数不定——用下拉而不是一串换行的片子，
  // 筛选区因此恒为两行高（2026-09-07 用户定：同一类信息始终在同一位置，才扫得动）。产品并进这里分组，
  // 不再单开一组：产品是会话的属性，两处筛同一件事只会把筛选区撑开。
  const sel = el("select", {
    class: "select", "aria-label": "按会话筛选",
    onchange: (ev) => { const v = ev.target.value; STATE.session = v.startsWith("p:") ? "all" : v; STATE.product = v.startsWith("p:") ? v.slice(2) : "all"; renderFilters(); renderRuns(); },
  });
  sel.append(el("option", { value: "all", text: `全部会话（${STATE.runs.length}）` }));
  const byProduct = {};
  for (const s of sessionIds) (byProduct[STATE.sessions[s]?.agent ?? "未上报"] ??= []).push(s);
  for (const [product, ids] of Object.entries(byProduct).sort(([a], [b]) => (a < b ? -1 : 1))) {
    const group = el("optgroup", { label: product });
    if (ids.length > 1) group.append(el("option", { value: `p:${product}`, text: `全部 ${product}（${ids.reduce((n, s) => n + sessionCounts[s], 0)}）` }));
    for (const s of ids.sort((a, b) => sessionCounts[b] - sessionCounts[a])) {
      group.append(el("option", { value: s, text: `${clipLabel(sessionLabel(s), 22)}（${sessionCounts[s]}）`, title: `${s}\n${STATE.sessions[s]?.workspace ?? ""}` }));
    }
    sel.append(group);
  }
  sel.value = STATE.product !== "all" ? `p:${STATE.product}` : STATE.session;
  const shown = visibleRuns().length;
  const filtered = STATE.filter !== "all" || STATE.product !== "all" || STATE.session !== "all";
  // 计数跟着下拉那一行右对齐：放在片子那一行会把最后一枚片子挤到换行（console.md §7：计数是筛后数）
  box.append(el("div", { class: "selrow" }, sel, el("span", { class: "count", text: filtered ? `${shown}/${STATE.runs.length}` : `${shown} 条` })));
  // 第二行：来源。四五个短词，一行放得下，用片子——可点的东西长得像可点的东西。
  // 无数据只降透明度不移除（console.md §7）
  const row = el("div", { class: "chiprow", role: "group", "aria-label": "按来源筛选" });
  const counts = {};
  for (const r of STATE.runs) counts[r.source.kind] = (counts[r.source.kind] ?? 0) + 1;
  for (const k of ["all", ...Object.keys(LEX.runSource)]) {
    const n = k === "all" ? STATE.runs.length : (counts[k] ?? 0);
    row.append(el("button", {
      class: `chip${n === 0 && k !== "all" ? " chip--dimmed" : ""}`,
      "aria-pressed": STATE.filter === k,
      title: k === "all" ? "" : LEX.runSource[k].hint,
      onclick: () => { STATE.filter = k; renderFilters(); renderRuns(); },
    }, `${k === "all" ? "全部" : LEX.runSource[k].zh} ${n}`));
  }
  box.append(row);
}
function visibleRuns() {
  return STATE.runs.filter((r) =>
    (STATE.filter === "all" || r.source.kind === STATE.filter) && (STATE.product === "all" || productOf(r) === STATE.product) && (STATE.session === "all" || r.sessionId === STATE.session));
}
function renderRuns() {
  const list = document.getElementById("runs");
  list.replaceChildren();
  const runs = visibleRuns();
  if (runs.length === 0) {
    const msg = STATE.runs.length === 0
      ? el("div", { class: "empty" }, "这里会显示 agent 每一次运行的记录。", el("br"), "跑一轮就会出现：", el("br"), el("code", { text: 'echo-agent "帮我看看这个仓库"' }))
      : el("div", { class: "empty" }, "这个筛选下没有 run。", el("br"), el("button", { class: "btn", onclick: () => { STATE.filter = "all"; STATE.product = "all"; STATE.session = "all"; renderFilters(); renderRuns(); } }, "清除筛选"));
    list.append(el("li", {}, msg));
    return;
  }
  // 只重复真正区分得开的那几维：一个产品跑 16 条时把产品名写 16 遍，占着位却不告诉你任何事
  const showProduct = varies(runs, productOf);
  const showSession = varies(runs, (r) => r.sessionId ?? undefined);
  const showWorkspace = varies(runs, (r) => sessionOf(r)?.workspace);
  for (const r of runs) {
    const dur = r.endedAt === null ? "未收尾" : fmtMs(r.endedAt - r.acceptedAt);
    const ws = sessionOf(r)?.workspace ?? "";
    const minor = r.source.kind === "dream"; // 记忆整理：系统自理，整行调暗，不与对话争扫读
    const parts = [];
    if (showProduct) parts.push(productOf(r));
    if (showSession && r.sessionId) parts.push(sessionLabel(r.sessionId));
    if (parts.length === 0) parts.push(LEX.runSource[r.source.kind]?.zh ?? r.source.kind); // 都不区分时，至少说清这是哪一类
    const open = () => openRun(r.runId);
    // **每行恒两行**（2026-09-07 用户定）：第一行名称 + 右对齐耗时，第二行时间 · 状态 · 来源。
    // 整理 run 走同一副骨架，只把整行调暗——此前它是一行、对话是三行，两种读法交替，视线一直在切换。
    const item = el("button", {
      class: `run${minor ? " run--minor" : ""}`, role: "option", "aria-selected": STATE.selected === r.runId,
      title: `${r.runId}${ws ? `\n${ws}` : ""}`, onclick: open,
    },
      el("div", { class: "l1" },
        el("span", { class: "name", text: minor && parts.length === 0 ? LEX.runSource.dream.zh : parts.join(" · ") }),
        el("span", { class: "dur mono", text: dur })),
      el("div", { class: "l2" },
        el("span", { class: "mono", text: fmtClock(r.acceptedAt) }),
        statusMark(LEX.runStatus[r.status], r.status),
        // 来源只用文字：它是次要属性，不该每行都戴一个色块（用户评审：来源主要靠文字区分）
        el("span", { class: "src", text: LEX.runSource[r.source.kind]?.zh ?? r.source.kind, title: LEX.runSource[r.source.kind]?.hint ?? "" }),
        // 只放目录名：列表栏 280px 宽，放不下整条路径——`…/…` 比不放更糟。全路径在行的 title 与详情里
        showWorkspace ? el("span", { class: "ws mono", text: ws.split("/").filter(Boolean).pop() ?? "", title: ws }) : null));
    list.append(item);
  }
}
function renderFollow() {
  document.getElementById("follow").setAttribute("aria-pressed", String(STATE.follow));
}

/* ── 详情 ── */
/* 工具行的对象位：content 档有 params 时带上第一个字符串参数（≤24 字，agent-behavior §2.3）；metadata 档没有 params，只剩工具名 */
function argPreview(body) {
  const p = body?.params;
  if (p === null || typeof p !== "object") return "";
  for (const v of Object.values(p)) {
    if (typeof v !== "string" || v.trim() === "") continue;
    const s = v.trim().replace(/\s+/g, " ");
    return s.length > 24 ? `${s.slice(0, 24)}…` : s;
  }
  return "";
}
function verbFor(name, attrs, body) {
  if (name === "tool.execute") return { verb: LEX.toolVerbs[attrs.toolName] ?? "调用", obj: attrs.toolName ?? "?", arg: argPreview(body) };
  if (name === "turn.execute") return { verb: "轮", obj: `#${attrs.iteration ?? "?"}` };
  // 四层循环里的另外两层（run-loop-layers.md）。只在有分叉时才出现在时间线上，见 foldSingleLayers
  if (name === "reply.execute") return { verb: "回应", obj: LEX.replySource?.[attrs.source]?.zh ?? attrs.source ?? "" };
  if (name === "attempt.execute") return { verb: "尝试", obj: `#${attrs.attempt ?? "?"}${attrs.result && attrs.result !== "landed" ? ` · ${attrs.result}` : ""}` };
  if (name === "model.generate") return { verb: "模型生成", obj: attrs.stopReason ?? "" };
  if (name.startsWith("memory.mutation.")) {
    const v = { create: "记住", replace: "修改", insert: "修改", rename: "修改", delete: "删除" }[attrs.operation] ?? attrs.operation;
    return { verb: v, obj: attrs.partition ? `${attrs.partition}${attrs.reasonCode ? ` · ${attrs.reasonCode}` : ""}` : "" };
  }
  if (name === "memory.compose") return { verb: "回忆", obj: `${attrs.blocks ?? 0}/${attrs.regions ?? 0} 个分区` };
  if (name === "observation.gap") return { verb: "记录缺口", obj: attrs.reason ?? "" };
  if (name.startsWith("inbox.")) {
    // 只有一条时说是谁发的：source 是投递方（session = 另一段会话），ref 是它给的编号；多条只说几条
    const who = attrs.source ? `${attrs.source}${attrs.ref ? ` ${attrs.ref}` : ""}` : "";
    const tail = attrs.reason ? ` · ${attrs.reason}` : attrs.deduplicated ? " · 重复" : attrs.via === "refresh" ? " · 别的进程写入" : "";
    return { verb: LEX.records[name]?.zh ?? name, obj: `${who || `${attrs.count ?? 0} 条`}${tail}` };
  }
  if (name.startsWith("schedule.")) return { verb: LEX.records[name]?.zh ?? name, obj: attrs.scheduleId ?? "" };
  if (name === "task.state.committed") return { verb: "任务状态", obj: `${attrs.operation ?? ""} ×${attrs.count ?? 0}` };
  // 上层 agent 的领域事件：名字都叫 agent.custom_event，真正是哪件事在 customEventType 上（metadata 档 body 恒空，
  // 不把它摆出来的话一行里什么都没有——实测一条 run 里四行「自定义事件」谁也分不出）
  if (name === "agent.custom_event") return { verb: LEX.records[name]?.zh ?? name, obj: attrs.customEventType ?? "" };
  return { verb: LEX.records[name]?.zh ?? name, obj: "" };
}

/* content 档才有的逐条流式记录：折进所属的进行中 span（一轮回复几百条 delta，逐行列出来只会淹没时间线），
   条数记在 entry.folded 上，展开时能看到 */
const FOLDED_INTO = { "model.generate.delta": "model.generate", "tool.execute.progress": "tool.execute" };

/* 紧跟在某条 span 之后、说的是同一件事的记录：折进那条，不另起一行。
   `model.usage` 就是刚结束那次生成的 token 数——模型生成行的结果位已经写着 `10611↑ 867↓`，再来一行是同一句话说两遍。 */
/*
 * `model.usage` 是刚结束那次生成的 token 数——模型生成行的结果位已经写着它。
 * `agent.message.appended` 紧跟在一次工具执行之后时，说的是「这次的工具结果进了 transcript」，
 * 也就是那一行的后半句：单列一行只是把同一件事说两遍，而一条 run 里能有十几条（实测截图）。
 * 折进去的记录不丢：行上写 `+N`，展开右栏能看到计数。
 */
const FOLDED_INTO_PREVIOUS = { "model.usage": "model.generate", "agent.message.appended": "tool.execute" };

/* span_start / span_end 配对成一行（§2.3：进行中的条目留在列表里，end 只补结果，不另起一行） */
function buildEntries(vm) {
  const entries = [];
  const open = new Map();
  const keyOf = (t) => `${t.name}|${t.attributes.toolCallId ?? ""}|${t.attributes.iteration ?? ""}|${t.attributes.attempt ?? ""}|${t.depth}`;
  const findOpen = (name, toolCallId) => {
    let found = null;
    for (const stack of open.values()) for (const e of stack) if (e.start.name === name && (toolCallId === undefined || e.start.attributes.toolCallId === toolCallId)) found = e;
    return found;
  };
  for (const t of vm.timeline) {
    const ownerName = FOLDED_INTO[t.name];
    if (ownerName !== undefined) {
      const owner = findOpen(ownerName, t.attributes.toolCallId);
      if (owner) { owner.folded = (owner.folded ?? 0) + 1; owner.foldedOf = t.name; continue; }
    }
    if (t.kind === "span_start") {
      const e = { start: t, end: null, key: keyOf(t) };
      entries.push(e);
      const stack = open.get(e.key) ?? [];
      stack.push(e);
      open.set(e.key, stack);
      continue;
    }
    if (t.kind === "span_end") {
      const stack = open.get(keyOf(t));
      const e = stack?.pop();
      if (e) { e.end = t; continue; }
    }
    const prev = entries[entries.length - 1];
    if (FOLDED_INTO_PREVIOUS[t.name] !== undefined && prev !== undefined && prev.start.name === FOLDED_INTO_PREVIOUS[t.name]) {
      prev.folded = (prev.folded ?? 0) + 1;
      prev.foldedOf = t.name; // 给 `+N` 一个说得出口的名字，不然那个数字没人知道是什么
      continue;
    }
    // **连着的同名事件折成一行**：一批工具结果回来会连记 4 条 `agent.message.appended`，
    // 逐条列出来只是把同一句话说四遍，还把真正的动作挤出屏幕（实测一条 run 里十几条）。
    // 折起的那几条不丢：行上写 `×N`，右栏说清是哪一段 seq。
    if (prev !== undefined && prev.single && prev.start.name === t.name && prev.start.depth === t.depth) {
      prev.repeat = (prev.repeat ?? 1) + 1;
      prev.lastSeq = t.seq;
      continue;
    }
    entries.push({ start: t, end: null, key: null, single: true });
  }
  return foldSingleLayers(entries);
}

/**
 * 四层里**没有分叉的那层不占一行**：一个 run 只有一条 reply、一个 turn 只跑了一次 attempt 时，
 * 那两行说的都是「就这一个」——不区分任何东西，却各吃掉一行和一级缩进。有分叉时（多条 reply、
 * 重试出的第二个 attempt）照常显示，那正是要看的东西。折起的层不留占位，后代的缩进相应提一级。
 */
function foldSingleLayers(entries) {
  const replies = entries.filter((e) => e.start.name === "reply.execute").length;
  const attemptsOfTurn = {};
  for (const e of entries) {
    if (e.start.name !== "attempt.execute") continue;
    const turnId = e.start.attributes.turnId ?? "";
    attemptsOfTurn[turnId] = (attemptsOfTurn[turnId] ?? 0) + 1;
  }
  const hideReply = replies === 1;
  const out = [];
  for (const e of entries) {
    const name = e.start.name;
    if (name === "reply.execute" && hideReply) continue;
    if (name === "attempt.execute" && attemptsOfTurn[e.start.attributes.turnId ?? ""] === 1) continue;
    // reply 折起后 1 层空出来：turn 及更深的都提一级，agent 级事件（本来就在 1 层）不动
    e.indent = hideReply && e.start.depth >= 2 ? e.start.depth - 1 : e.start.depth;
    out.push(e);
  }
  // 谁能收起：**只有真正的 span**（轮 / 尝试 / 模型生成 / 工具 / 压缩）。
  // 只按缩进算父子会把 `run.started` 这种单点事件也变成父节点——它后面恰好跟着更深的行，
  // 但它不是容器，给它一个箭头是在说谎（实测截图里 `开始执行` 和 `消息入账` 都长出了箭头）。
  for (let i = 0; i < out.length; i++) {
    let n = 0;
    for (let j = i + 1; j < out.length && out[j].indent > out[i].indent; j++) n++;
    out[i].hasChildren = !out[i].single && out[i].start.kind === "span_start" && n > 0;
    out[i].hiddenCount = n;
  }
  return out;
}

/* 展开区最多摆这么多字符；再长去 `observe show <id> --body` 看 */
const TEXT_LIMIT = 8000;
function clip(s) {
  return s.length > TEXT_LIMIT ? `${s.slice(0, TEXT_LIMIT)}\n…还有 ${s.length - TEXT_LIMIT} 字符（完整正文：observe show <run-id> --body）` : s;
}
/* content 档的正文字段拆成段落（参数 / 结果 / 报错 / 回复），并从原始 JSON 里拿掉，免得同一段正文出现两遍 */
function contentSections(t, end) {
  const secs = [];
  const omit = new Set();
  const start = t.body ?? {};
  const fin = end?.body ?? {};
  const add = (label, value, owner, key, tone) => {
    if (value === undefined || value === null || value === "") return;
    secs.push({ label, text: typeof value === "string" ? value : JSON.stringify(value, null, 2), tone });
    omit.add(`${owner}.${key}`);
  };
  if (t.name === "tool.execute") {
    add("参数", start.params, "body", "params");
    add(fin.isError ? "报错" : "结果", fin.content, "end", "content", fin.isError ? "bad" : undefined);
  } else if (t.name === "model.generate") {
    add("回复", fin.text, "end", "text");
    if (Array.isArray(fin.toolUseBlocks) && fin.toolUseBlocks.length > 0) add("工具调用", fin.toolUseBlocks, "end", "toolUseBlocks");
    add("报错", fin.errorMessage, "end", "errorMessage", "bad");
  } else if (t.name === "agent.message.appended") {
    add(start.role === "user" ? "用户" : start.role === "toolResult" ? "工具结果" : "正文", start.text, "body", "text");
  } else if (t.name === "agent.loop.ended") {
    add("报错", start.errorMessage, "body", "errorMessage", "bad");
  } else if (t.name.startsWith("inbox.") && Array.isArray(start.records)) {
    const lines = start.records.map((r) => `${r.source ?? r.role}${r.ref ? ` ${r.ref}` : ""}${r.recordId ? ` · ${r.recordId}` : ""}${r.text !== undefined ? `\n${r.text}${r.textTruncated ? "…" : ""}` : ""}`);
    if (lines.length > 0) add("消息", lines.join("\n\n"), "body", "records");
    add(t.name === "inbox.sealed" ? "封账本原因" : "原文", start.message, "body", "message", "bad");
  } else if (t.name === "context.compact" && Array.isArray(fin.spans)) {
    const sums = fin.spans.filter((s) => typeof s.summary === "string");
    if (sums.length > 0) add("摘要", sums.map((s) => `[${s.from}–${s.to}]\n${s.summary}`).join("\n\n"), "end", "spans");
  }
  const strip = (obj, owner) => {
    if (obj === undefined || obj === null) return obj;
    const out = {};
    for (const [k, v] of Object.entries(obj)) if (!omit.has(`${owner}.${k}`)) out[k] = v;
    return out;
  };
  return { secs, strip };
}

function renderEntry(e, gaps, runMs = 0) {
  const t = e.start;
  const end = e.end;
  const attrs = { ...t.attributes, ...(end?.attributes ?? {}) };
  const { verb, obj, arg } = verbFor(t.name, attrs, t.body);
  const term = LEX.records[t.name];
  const isTool = t.name === "tool.execute";
  const failed = (isTool && attrs.isError === true) || t.name.endsWith(".failed") || t.name.endsWith(".partial") || t.name === "inbox.sealed" || (t.name === "agent.loop.ended" && attrs.status === "error");
  const warn = t.name === "observation.gap" || t.name.endsWith(".rejected") || t.name.endsWith(".missed") || t.name.endsWith(".released") || t.name === "model.retry.scheduled";
  const isOpen = !e.single && end === null && t.kind === "span_start";
  let prefix = "·";
  if (isTool || t.kind === "span_start") prefix = failed ? "✕" : "▸";
  if (t.name === "observation.gap") prefix = "⚠";
  if (t.name === "context.compact") prefix = "⤓";
  // 耗时与用量分两列：它们是两种量，混在一格里就只能靠 `·` 分辨，也没法上下对齐（用户评审第 1 条）
  let res = "";
  if (end && end.durationMs !== undefined) res = fmtMs(end.durationMs);
  else if (isOpen) res = "未收尾"; // 没有 span_end：账本不知道它是还在跑还是没了，不替进程说话
  if (isTool && failed) res = res || "出错";
  if (t.name === "observation.gap") res = `丢 ${t.body?.dropped ?? "?"} 条`;
  let usage = "";
  const u = end?.body?.usage;
  if (t.name === "model.generate" && u && (u.inputTokens || u.outputTokens)) usage = `${u.inputTokens ?? 0}↑ ${u.outputTokens ?? 0}↓`;
  const cls = ["tl"];
  if (t.name.startsWith("run.")) cls.push("tl--boundary");
  if (t.name === "turn.execute") cls.push("tl--turn");
  if (warn && !failed) cls.push("tl--warn");
  if (isOpen) cls.push("tl--open");
  if (failed) cls.push("tl--bad");
  const seq = t.seq;
  const selected = STATE.selectedEvent === seq;
  const collapsed = STATE.collapsed.has(seq);
  // **一行一件事**（2026-09-07 用户评审第 2 条）：箭头收放子事件，行本身选中并把内容送去右栏。
  // 原来点一行会就地展开一大块 JSON 把后面的行推走，连着看两条就找不回位置。
  const row = el("div", {
    class: cls.join(" "), role: "option", tabindex: 0, "aria-selected": selected,
    onclick: () => selectEvent(seq),
    onkeydown: (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); selectEvent(seq); } },
  },
    el("button", {
      class: "caret", "data-empty": e.hasChildren ? "0" : "1", tabindex: e.hasChildren ? 0 : -1,
      "aria-label": collapsed ? "展开子事件" : "收起子事件", "aria-expanded": e.hasChildren ? !collapsed : undefined,
      text: e.hasChildren ? (collapsed ? "▸" : "▾") : "",
      onclick: (ev) => { ev.stopPropagation(); if (!e.hasChildren) return; if (collapsed) STATE.collapsed.delete(seq); else STATE.collapsed.add(seq); renderDetail(); },
    }),
    el("span", { class: "t", text: `+${fmtMs(t.relativeMs)}` }),
    el("span", { class: "what", style: `padding-left: calc(var(--space-16) * ${e.indent ?? t.depth})` },
      el("span", { class: "prefix", text: prefix }),
      el("span", { class: "verb", text: verb }),
      obj ? el("span", { class: "obj", text: obj }) : null,
      arg ? el("span", { class: "arg", text: `"${arg}"` }) : null,
      el("span", { class: "en", text: t.name }),
      e.folded ? el("span", { class: "folded", text: `+${e.folded}`, title: `折起 ${e.folded} 条紧随其后的 ${e.foldedOf ?? "同源记录"}` }) : null,
      e.repeat ? el("span", { class: "folded", text: `×${e.repeat}`, title: `连续 ${e.repeat} 条同名记录（seq ${t.seq}–${e.lastSeq}）` }) : null,
      collapsed && e.hiddenCount ? el("span", { class: "folded", text: `⋯${e.hiddenCount}` }) : null,
    ),
    el("span", { class: "usage", text: usage }),
    el("span", { class: "res", text: res }),
    // 条形轨占最后一列：数字要逐行读，条形一眼就看出「12 秒里 9 秒花在第一轮」。刻度在时间线顶部
    el("span", { class: "track" },
      runMs > 0 && end?.durationMs !== undefined
        ? el("span", { class: "tl-bar", style: `left: ${(100 * t.relativeMs) / runMs}%; width: max(2px, ${(100 * end.durationMs) / runMs}%)` })
        : null),
  );
  return row;
}

/** 选中一条事件：只换右栏，时间线不动（评审第 2、3 条的核心）。地址栏跟着走，现场可分享、回得来。 */
function selectEvent(seq) {
  STATE.selectedEvent = seq;
  if (STATE.selected !== null) history.replaceState(null, "", `?run=${encodeURIComponent(STATE.selected)}&evt=${seq}`);
  renderDetail();
}

/** 收起的行把它的整棵子树藏起来；被藏的行不参与「上一条 / 下一条」。 */
function visibleEntries(entries) {
  const out = [];
  let hideDeeperThan = null;
  for (const e of entries) {
    if (hideDeeperThan !== null && e.indent > hideDeeperThan) continue;
    hideDeeperThan = null;
    out.push(e);
    if (e.hasChildren && STATE.collapsed.has(e.start.seq)) hideDeeperThan = e.indent;
  }
  return out;
}

/** 复制并给回执——不然用户不知道点没点成。 */
function copyButton(label, text) {
  const b = el("button", { class: "copy", text: label, title: "复制" });
  b.addEventListener("click", (ev) => {
    ev.stopPropagation();
    void navigator.clipboard?.writeText(text);
    b.textContent = "已复制";
    b.dataset.done = "1";
    setTimeout(() => { b.textContent = label; delete b.dataset.done; }, 1200);
  });
  return b;
}

/**
 * 右栏：选中那条事件的详情。**先给人话摘要，再给原始 JSON**（默认收起）——
 * 评审第 2 条：不要让用户每次都从 name、seq 开始找重点。
 */
function renderEventDetail(entries, vm) {
  const list = visibleEntries(entries);
  const idx = list.findIndex((e) => e.start.seq === STATE.selectedEvent);
  const box = el("aside", { class: "evt", "aria-label": "事件详情" });
  if (idx < 0) {
    // 空着不如给个入口：把最耗时的几步摆出来，点一下就跳过去——「为什么花了这么久」的第二层
    // （第一层是顶部指标行的「其余」）。只算叶子：轮 / 回应本来就是容器，列出来等于把总时长重复一遍。
    const CONTAINERS = new Set(["reply.execute", "turn.execute", "attempt.execute"]);
    const slow = list
      .filter((x) => x.end?.durationMs !== undefined && !CONTAINERS.has(x.start.name))
      .sort((a, b) => b.end.durationMs - a.end.durationMs)
      .slice(0, 5);
    box.append(el("div", { class: "evthead" }, el("span", { class: "verb", text: "最耗时的几步" })));
    if (slow.length === 0) {
      box.append(el("p", { class: "markwhy", text: "这条 run 里没有带耗时的步骤。选时间线里的一行看它的记录。" }));
      return box;
    }
    const ul = el("ul", { class: "slow" });
    for (const x of slow) {
      const a = { ...x.start.attributes, ...(x.end?.attributes ?? {}) };
      const { verb, obj } = verbFor(x.start.name, a, x.start.body);
      ul.append(el("li", {}, el("button", { class: "slowrow", onclick: () => selectEvent(x.start.seq) },
        el("span", { class: "verb", text: verb }),
        obj ? el("span", { class: "obj", text: obj }) : null,
        el("span", { class: "res", text: fmtMs(x.end.durationMs) }))));
    }
    box.append(ul);
    box.append(el("p", { class: "markwhy", text: "点一行跳到时间线里那一步；或直接在左边选任意一行。" }));
    return box;
  }
  const e = list[idx];
  const t = e.start;
  const end = e.end;
  const attrs = { ...t.attributes, ...(end?.attributes ?? {}) };
  const { verb, obj } = verbFor(t.name, attrs, t.body);
  const go = (delta) => { const n = list[idx + delta]; if (n) selectEvent(n.start.seq); };
  box.append(el("div", { class: "evthead" },
    el("span", { class: "verb", text: verb }),
    obj ? el("span", { class: "obj", text: obj }) : null,
    el("span", { class: "nav" },
      el("button", { class: "navbtn", text: "↑", title: "上一条事件", disabled: idx === 0, onclick: () => go(-1) }),
      el("button", { class: "navbtn", text: "↓", title: "下一条事件", disabled: idx === list.length - 1, onclick: () => go(1) })),
  ));
  const term = LEX.records[t.name];
  if (term?.hint) box.append(el("p", { class: "markwhy", text: term.hint }));

  const dl = el("dl", { class: "fields" });
  const field = (k, ...v) => { dl.append(el("dt", { text: k }), el("dd", {}, ...v)); };
  // ViewModel 的时间线只带相对时间（`relativeMs`），绝对时刻由 run 的受理时刻加上去——**不要读 `occurredAt`**，
  // `RunObservationTimelineItem` 上没有这个字段（读到的是 undefined，`fmtClock` 会给出 Invalid Date）
  const absAt = (item) => vm.header.acceptedAt + item.relativeMs;
  field("起", el("span", { class: "mono", text: `${fmtClock(absAt(t))} · +${fmtMs(t.relativeMs)}` }));
  if (end?.durationMs !== undefined) {
    field("止", el("span", { class: "mono", text: `${fmtClock(absAt(end))} · +${fmtMs(end.relativeMs)}` }));
    field("耗时", el("span", { class: "mono", text: fmtMs(end.durationMs) }));
  }
  field("记录", el("span", { class: "mono", text: t.name }), copyButton("复制", t.name));
  // 折起的那几条要交代清楚：行上写了 ×N，这里说是哪一段 seq、下面的正文是其中第一条
  if (e.repeat) field("连续", el("span", { text: `${e.repeat} 条同名记录（seq ${t.seq}–${e.lastSeq}），下面显示第一条` }));
  if (e.folded) field("折起", el("span", { text: `${e.folded} 条 ${e.foldedOf ?? "同源记录"}——它说的是这一行的后半句，不另占一行` }));
  // 关联运行：收件消费这类事实带着来源 run，能直接跳过去（多 agent 排查要顺着线索走）
  const linked = typeof attrs.runId === "string" && attrs.runId !== vm.header.runId ? attrs.runId : null;
  if (linked) field("关联", el("button", { class: "navbtn", text: "打开那条 run", onclick: () => openRun(linked) }));
  box.append(dl);

  const { secs, strip } = contentSections(t, end);
  for (const s of secs) box.append(el("div", { class: `tl-sec${s.tone === "bad" ? " tl-sec--bad" : ""}` }, el("span", { class: "tl-sec-label", text: s.label }), el("pre", { class: "tl-text", text: clip(s.text) })));

  const raw = { name: t.name, seq: t.seq, attributes: attrs, body: strip(t.body, "body"), endBody: strip(end?.body, "end") };
  if (e.folded) raw.folded = e.folded;
  const rawText = JSON.stringify(raw, null, 2);
  const det = el("details", { class: "raw", ...(STATE.rawOpen ? { open: true } : {}) },
    el("summary", { text: "原始 JSON" }),
    el("div", { class: "rawbox" }, el("pre", { text: rawText })));
  det.addEventListener("toggle", () => { STATE.rawOpen = det.open; });
  det.querySelector("summary").append(" ", copyButton("复制", rawText));
  box.append(det);
  return box;
}

function renderDetail() {
  const box = document.getElementById("detail");
  box.replaceChildren();
  const vm = STATE.vm;
  if (vm === null) {
    box.append(el("div", { class: "empty" }, STATE.runs.length === 0 ? "还没有 run 可看。" : "选一条 run。"));
    return;
  }
  if (vm.kind === "pruned") {
    box.append(el("div", { class: "head" }, el("span", { class: "title mono", text: vm.header.runId }), statusMark(LEX.runStatus[vm.header.status], vm.header.status)),
      el("p", { class: "muted", text: "这条 run 的记录 body 已被清理（retention），只剩 header 与缺口。" }));
    return;
  }
  const h = vm.header;
  const sk = statusKey(h, vm.outcome);
  // 没封口的 run 只说事实：最后一条记录是什么时候。「已跑 N 秒」是在替进程说它还活着，离线读者说不了这句话。
  // 绝对时刻 = 受理时刻 + 相对毫秒；ViewModel 的时间线项上没有 `occurredAt`
  const lastRel = vm.timeline.length > 0 ? vm.timeline[vm.timeline.length - 1].relativeMs : 0;
  const duration = h.endedAt === null ? `未收尾 · 最后记录 ${fmtClock(h.acceptedAt + lastRel)}` : fmtMs(h.endedAt - h.acceptedAt);
  const sess = h.sessionId ? STATE.sessions[h.sessionId] : undefined;
  // 标题是这段对话（用户扫读的锚点），不是 runId——那串 uuid 原来是全页最大的字，却谁也不读
  const title = sess?.name && sess.name !== h.sessionId ? sess.name : h.sessionId ? shortId(h.sessionId) : "临时对话";
  // ── 第一段：运行概览。滚动时钉在顶上，答「这次到底怎么样」（评审第 3 条）──
  const ov = el("div", { class: "overview" });
  ov.append(el("div", { class: "head" },
    el("span", { class: "title", text: title, title: h.sessionId ?? "" }),
    el("span", { class: "muted mono dur", text: duration }),
    el("span", { class: "marks" },
      markButton(LEX.runStatus[sk], sk),
      markButton(LEX.integrity[h.integrity], h.integrity),
      markButton(LEX.persistence[h.persistence], h.persistence)),
  ));
  // 状态的解释不藏在 title 里：点圆点，下面出一行人话（评审：「完整」「已落盘」要可查看的解释）
  if (STATE.markWhy) ov.append(el("p", { class: "markwhy", text: STATE.markWhy }));
  ov.append(el("div", { class: "sub" },
    el("span", { text: LEX.runSource[h.source.kind]?.zh ?? h.source.kind, title: LEX.runSource[h.source.kind]?.hint ?? "" }),
    el("span", { class: "mono", text: fmtClock(h.acceptedAt) }),
    sess ? el("span", { text: sess.agent }) : el("span", { class: "muted", text: h.sessionId ? "产品未上报" : "无会话" }),
    el("span", { class: "mono", text: `${vm.modelBinding.providerId}/${vm.modelBinding.modelId}`, title: `目录版本 ${vm.modelBinding.catalogRevision}` }),
  ));
  if (sk === "truncated") ov.append(el("p", { class: "markwhy", text: "跑到上限停了，这次的结果可能不完整" }));
  if (vm.outcome && vm.outcome.status === "error" && sk !== "truncated") ov.append(el("p", { class: "tl--bad markwhy", text: `出了点问题：${vm.outcome.error?.code ?? "unknown"}。看时间线里标红的那一行` }));

  // 指标行：答「为什么花了这么久」的第一层。总时长拆成 模型 / 工具 / 其余，口径写在 title 里
  const m = vm.summary.model;
  const toolCalls = vm.summary.tools.reduce((n, t) => n + t.calls, 0);
  const toolErrors = vm.summary.tools.reduce((n, t) => n + t.errors, 0);
  const toolMs = vm.summary.tools.reduce((n, t) => n + t.totalDurationMs, 0);
  const totalMs = h.endedAt === null ? null : h.endedAt - h.acceptedAt;
  const tokens = m.calls > 0 && m.inputTokens === 0 && m.outputTokens === 0 ? "未上报" : `${m.inputTokens}↑ ${m.outputTokens}↓`;
  const metrics = el("div", { class: "metrics" });
  const metric = (k, v, opts = {}) => metrics.append(el("div", { class: "metric", title: opts.hint ?? "" }, el("span", { class: "k", text: k }), el("span", { class: `v${opts.bad ? " bad" : ""}`, text: v })));
  metric("模型", `${m.calls} 次 · ${fmtMs(m.totalDurationMs)}`, { hint: "落地的模型生成次数与它们的耗时合计" });
  metric("token", tokens, { hint: "provider 回报的用量；没给就说没给，不写 0" });
  metric("工具", `${toolCalls} 次 · ${fmtMs(toolMs)}`, { hint: "工具调用次数与耗时合计" });
  if (toolErrors > 0) metric("工具出错", `${toolErrors}`, { bad: true });
  if (totalMs !== null) {
    const rest = Math.max(0, totalMs - m.totalDurationMs - toolMs);
    metric("其余", fmtMs(rest), { hint: "总时长减去模型与工具：上下文构建、记忆整理、排队与落盘都在这里" });
  }
  metric("记录", `${vm.summary.recordCount}`, { hint: "这条 run 落进账本的记录条数" });
  ov.append(metrics);

  // 采集档只在「看不到正文」时出现，做成低强度信息条——它是一句能照做的提示，不是正文段落
  if (h.capturePolicy !== "content") {
    const note = h.capturePolicy === "off" ? "这条 run 只记了边界：起 agent 时给了 --observe off。" : "只有形状与计数，没有正文。要看模型回复与工具参数 / 结果，起 agent 时加 --observe content。";
    ov.append(el("div", { class: "infobar" }, el("span", { text: "采集档" }), el("span", { text: note })));
  }
  box.append(ov);

  const dl = el("dl", { class: "fields" });
  const field = (label, ...value) => { dl.append(el("dt", { text: label }), el("dd", {}, ...value)); };
  field("agent", el("span", { class: "mono", text: `${h.agentId} · ${h.agentInstanceId}` }));
  field("会话", el("span", { class: "mono", text: h.sessionId ?? "无（临时对话）" }));
  field("工作目录", el("span", { class: "mono", text: sess ? sess.workspace : "—" }));
  // 完整 runId 收进这里（评审：路径和完整 ID 收进环境详情），要用的时候一键复制
  field("run", el("span", { class: "mono", text: h.runId }), copyButton("复制", h.runId));
  field("模型", el("span", { class: "mono", text: `${vm.modelBinding.providerId} / ${vm.modelBinding.modelId} · ${vm.modelBinding.catalogRevision}` }));
  const chips = el("div", { class: "chips" });
  if (vm.assembly.slots.length === 0) chips.append(el("span", { class: "muted", text: vm.assembly.digest === "not-captured" ? "未上报" : "无" }));
  for (const s of vm.assembly.slots) chips.append(el("span", { class: "chip", title: `${s.entryId}@${s.entryGeneration}` }, s.slot));
  field("装配", chips);
  field("采集档", el("span", { class: "mono", text: h.capturePolicy }));
  field("runtime", el("span", { class: "mono", text: `${h.runtimeId} · ${h.runtimeGeneration}` }));
  // 展开状态存进 STATE：详情每 2s 重绘一次，不存的话展开会被下一次轮询合上
  const env = el("details", { class: "env", ...(STATE.envOpen ? { open: true } : {}) }, el("summary", { text: "运行环境" }), dl);
  env.addEventListener("toggle", () => { STATE.envOpen = env.open; });
  box.append(env);

  // ── 第二段：执行过程（时间线）+ 第三段的一半（事件详情）并排 ──
  box.append(el("h3", { text: "执行过程" }));
  const runMs = h.endedAt === null ? 0 : h.endedAt - h.acceptedAt;
  const entries = buildEntries(vm);
  const exec = el("div", { class: "exec" });
  const left = el("div", {});
  // 时间刻度：给那几根条一个坐标系。没有它，灰线看着像滚动条或分隔线（评审第 1 条）
  if (runMs > 0) {
    // 只标起止两点：轨道 100 出头的像素放不下第三个数字（实测中点会和右端叠在一起）
    const ticks = el("div", { class: "ticks" });
    ticks.append(el("span", { class: "tick", style: "left: 0", text: "0" }));
    ticks.append(el("span", { class: "tick tick--end", style: "left: 100%", text: fmtMs(runMs) }));
    left.append(el("div", { class: "scale" }, el("span", { class: "scalelabel", text: "耗时占比" }), ticks));
  }
  const tl = el("ul", { class: "timeline", role: "listbox", "aria-label": "执行过程" });
  for (const e of visibleEntries(entries)) {
    tl.append(el("li", {}, renderEntry(e, vm.health.canonicalGaps, runMs)));
  }
  left.append(tl);
  exec.append(left, renderEventDetail(entries, vm));
  box.append(exec);

  box.append(el("h3", { text: "工具与用量" }));
  if (vm.summary.tools.length === 0) {
    box.append(el("p", { class: "muted", text: h.capturePolicy === "off" ? "未采集（capture policy off）" : "这次没有调用工具" }));
  } else {
    const table = el("table", {}, el("thead", {}, el("tr", {},
      el("th", { text: "工具" }), el("th", { class: "num", text: "调用" }), el("th", { class: "num", text: "成功" }), el("th", { class: "num", text: "出错" }), el("th", { class: "num", text: "耗时" }), el("th", { class: "num", text: "结果字符" }))));
    const tb = el("tbody");
    for (const t of vm.summary.tools) tb.append(el("tr", {},
      // 表格里只放工具名：动词是时间线上给动作用的，摆进「工具」列只是把同一个词写两遍
      el("td", { class: "mono", text: t.toolId }), el("td", { class: "num", text: t.calls }), el("td", { class: "num", text: t.successes }),
      el("td", { class: "num", text: t.errors }), el("td", { class: "num", text: fmtMs(t.totalDurationMs) }), el("td", { class: "num", text: t.resultBytes })));
    table.append(tb);
    box.append(table);
  }
  // 模型用量不在这里重复：它已经在顶部的指标行里（评审第 3 条：顶部就能读到调用次数与耗时）

  const gaps = vm.health.canonicalGaps;
  box.append(el("div", { class: "health" },
    statusMark(LEX.integrity[h.integrity], h.integrity),
    gaps.length === 0 ? null : el("span", { text: `缺口 ${gaps.length}：${gaps.map((g) => `${g.reason}（丢 ${g.dropped}）`).join("、")}` }),
    statusMark(LEX.persistence[vm.health.persistence], vm.health.persistence),
    el("span", { text: vm.health.redacted ? "不含正文" : "含正文" }),
    el("span", { class: "mono", text: `记录 ${vm.summary.recordCount}` }),
  ));
}

/* ── 数据 ── */
async function getJson(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(`${url} → ${r.status}`);
  return r.json();
}
let lastOk = 0;
/* run 之外的记录：收件 / ack / 闹钟……每 2s 一次（它们不像 run 那样秒级变化） */
async function loadActivity() {
  try {
    const res = await getJson("/api/activity?limit=30");
    STATE.activity = res.items;
    for (const [id, s] of Object.entries(res.sessions ?? {})) if (!STATE.sessions[id]) STATE.sessions[id] = s;
    renderActivity();
  } catch {}
}
function renderActivity() {
  const list = document.getElementById("acts");
  list.replaceChildren();
  document.getElementById("activity-hint").textContent = STATE.activity.length ? `${STATE.activity.length} 条` : "";
  if (STATE.activity.length === 0) {
    list.append(el("li", { class: "muted", text: "还没有 run 之外的事：收件、整批 ack、闹钟投递会出现在这里。" }));
    return;
  }
  const multi = new Set(STATE.activity.map((a) => a.sessionId)).size > 1;
  for (const { sessionId, record: t } of STATE.activity) {
    const attrs = t.attributes ?? {};
    const { verb, obj } = verbFor(t.name, attrs, t.body);
    const term = LEX.records[t.name];
    const bad = t.name === "inbox.sealed" || t.name.endsWith(".failed") || t.name.endsWith("-failed");
    const warn = !bad && (t.name.endsWith(".rejected") || t.name.endsWith(".released") || t.name.endsWith(".missed"));
    const runId = typeof attrs.runId === "string" ? attrs.runId : null;
    const row = el("div", {
      class: `act${bad ? " tl--bad" : warn ? " tl--warn" : ""}`,
      title: `${term?.hint ?? t.name}${runId ? `\n点开对应的 run：${runId}` : ""}`,
    },
      el("span", { class: "t", text: fmtClock(t.occurredAt) }),
      el("span", { class: "what" }, el("span", { class: "verb", text: verb }), obj ? el("span", { class: "obj", text: obj }) : null),
      el("span", { class: "who", text: multi ? clipLabel(sessionLabel(sessionId), 10) : "", title: multi ? sessionLabel(sessionId) : "" }),
    );
    if (runId) {
      row.setAttribute("role", "button");
      row.setAttribute("tabindex", "0");
      row.addEventListener("click", () => openRun(runId));
    }
    list.append(el("li", {}, row));
  }
}
async function loadRuns() {
  try {
    const page = await getJson("/api/runs?limit=50");
    STATE.runs = page.items;
    STATE.sessions = page.sessions ?? {};
    lastOk = Date.now();
    if (STATE.follow) {
      // 跟随：最新的非整理 run > 最新的。列表按 acceptedAt 倒序，活着的 agent 的新 run 自然排最前；
      // 不再优先「running」——那只是没封口，可能是早就死了的进程留下的，跟着它会被钉住
      const target = STATE.runs.find((r) => r.source.kind !== "dream") ?? STATE.runs[0] ?? null;
      const next = target ? target.runId : null;
      // 换了 run 就清掉上一条的事件选择与折叠，否则 seq 会串到另一条 run 的记录上
      if (next !== STATE.selected) { STATE.selected = next; STATE.selectedEvent = null; STATE.collapsed.clear(); STATE.markWhy = ""; await loadRun(); }
    } else if (STATE.selected !== null && !STATE.runs.some((r) => r.runId === STATE.selected)) {
      STATE.selected = STATE.runs[0]?.runId ?? null;
      STATE.selectedEvent = null;
      STATE.collapsed.clear();
      await loadRun();
    }
    renderFilters();
    renderRuns();
    const sessions = new Set(STATE.runs.map((r) => r.sessionId).filter(Boolean)).size;
    // 副标题只放会变的两个数；会话根与「只读」那句是常量，进 title（页头一行装不下就会换行，把标题挤下去）
    const desc = document.getElementById("desc");
    desc.textContent = `${STATE.runs.length} 条 run · ${sessions} 段会话`;
    desc.title = `${STATE.root}\n只读轮询 SQLite，agent 跑着也能看`;
  } catch (e) {
    document.getElementById("desc").textContent = `连不上 observe 服务：${e.message}。它退出了？重新跑 echo-agent observe serve`;
  }
  document.getElementById("freshness").textContent = lastOk ? `刷新于 ${fmtClock(lastOk)}` : "";
}
async function loadRun() {
  if (STATE.selected === null) { STATE.vm = null; renderDetail(); return; }
  try {
    const vm = await getJson(`/api/runs/${encodeURIComponent(STATE.selected)}`);
    STATE.vm = vm;
    renderDetail();
  } catch (e) {
    STATE.vm = null;
    renderDetail();
    document.getElementById("detail").append(el("p", { class: "tl--bad", text: `取不到这条 run：${e.message}` }));
  }
}

document.getElementById("follow").addEventListener("click", () => { STATE.follow = !STATE.follow; renderFollow(); if (STATE.follow) { history.replaceState(null, "", location.pathname); loadRuns(); } });
document.addEventListener("visibilitychange", () => { STATE.hidden = document.hidden; });

(async () => {
  // `?run=<id>`：直接打开某条（可分享、刷新不丢），这时不跟随
  const params = new URLSearchParams(location.search);
  const wanted = params.get("run");
  // `?evt=<seq>` 让「某一步发生了什么」这个现场可以直接发给别人，回来也还在原处
  const wantedEvt = Number(params.get("evt"));
  if (Number.isInteger(wantedEvt) && wantedEvt > 0) STATE.selectedEvent = wantedEvt;
  if (wanted) { STATE.selected = wanted; STATE.follow = false; renderFollow(); }
  try {
    const h = await getJson("/api/health");
    STATE.root = h.sessionId ? `会话 ${h.sessionId}` : h.sessionsRoot;
    // 会话清单读不出来（坏 / 旧 meta）：run 照看，但没有产品名与工作目录——把原因摆在页头，别让人以为是面板坏了
    if (h.sessionsProblem) {
      const bar = document.getElementById("problem");
      bar.textContent = `会话清单读不出来，产品名与工作目录暂缺（run 不受影响）：${h.sessionsProblem}`;
      bar.hidden = false;
    }
  } catch {}
  await loadRuns();
  await loadActivity();
  setInterval(() => { if (!STATE.hidden) loadRuns(); }, 500);
  setInterval(() => { if (!STATE.hidden) loadActivity(); }, 2000);
  setInterval(() => {
    if (STATE.hidden || STATE.selected === null) return;
    const cur = STATE.runs.find((r) => r.runId === STATE.selected);
    if (cur && cur.status === "running") loadRun(); // 没封口的就快刷：真在跑就能看到新记录；没了也只是多读几次
  }, 300);
  setInterval(() => { if (!STATE.hidden && STATE.selected !== null) loadRun(); }, 2000);
})();
</script>
</body>
